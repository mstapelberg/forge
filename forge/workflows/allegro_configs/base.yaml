run: [val, test, train, val, test]

cutoff_radius: 5.0
chemical_symbols: ['Ti', 'V', 'Cr', 'Zr', 'W']
model_type_names: ['Ti', 'V', 'Cr', 'Zr', 'W']
seed: 0
job_name: job_gen_8_2025-06-20_r6_stress100_b1_lrsched_fixed_no_dimers
wandb_name: allegro-stress-rmax-test # TODO: have this be configurable

data:
  _target_: nequip.data.datamodule.ASEDataModule
  train_file_path: data/allegro_gen_8_2025-06-20_no_dimers_train.xyz
  val_file_path:   data/allegro_gen_8_2025-06-20_no_dimers_val.xyz
  test_file_path:  data/allegro_gen_8_2025-06-20_no_dimers_test.xyz

  ase_args:
    format: extxyz

  key_mapping:
    REF_energy: total_energy
    REF_force:  forces
    REF_stress: stress

  transforms:
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      chemical_symbols: ['Ti', 'V', 'Cr', 'Zr', 'W']

  seed: ${seed}

  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 1
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 1
  test_dataloader: ${data.val_dataloader}

  stats_manager:
    _target_: forge.workflows.allegro_utils.ExtendedDataStatisticsManager
    type_names: ['Ti', 'V', 'Cr', 'Zr', 'W']

trainer:
  _target_: lightning.Trainer
  accelerator: gpu
  devices: 4
  num_nodes: 1
  max_epochs: 1000
  check_val_every_n_epoch: 1
  log_every_n_steps: 5

  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: results/${job_name}
      filename: "{epoch:03d}-{val0_epoch/stress_rmse:.4f}"
      monitor: "val0_epoch/stress_rmse"
      mode: "min"
      save_last: true
      save_top_k: 5

    #- _target_: nequip.train.callbacks.LossCoefficientScheduler
      #schedule:
        #175:
          #per_atom_energy_mse: 10.0
          #forces_mse:         1.0
          #stress_mse:         0.25

  logger:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    project: ${wandb_name}
    name: ${job_name}
    save_dir: results/${job_name}

training_module:
  _target_: nequip.train.EMALightningModule

  loss:
    _target_: nequip.train.MetricsManager
    metrics:
      - name: per_atom_energy_mse
        field:
          _target_: nequip.data.PerAtomModifier
          field: total_energy
        coeff: 1
        metric:
          _target_: nequip.train.MeanSquaredError
      - name: forces_stratified_huber
        field: forces
        coeff: 10
        metric:
          _target_: nequip.train.StratifiedHuberForceLoss
          delta_dict:
            0.0107: 0.0011 # small forces
            0.4981: 0.0498 # intermediate forces
            2.7991: 0.2799 # large forces
      - name: stress_mse
        field: stress
        coeff: 100
        metric:
          _target_: nequip.train.MeanSquaredError

  val_metrics:
    _target_: nequip.train.EnergyForceStressMetrics
    coeffs:
      per_atom_energy_rmse: 1.0
      forces_rmse:           1.0
      stress_rmse:           1.0

  test_metrics: ${training_module.val_metrics}

  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001

  lr_scheduler:
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      factor: 0.5
      patience: 10
      min_lr: 1e-6
    monitor: val0_epoch/weighted_sum
    interval: epoch
    frequency: 1

  model:
    _target_: allegro.model.AllegroModel

    seed: ${seed}
    model_dtype: float32
    type_names: ['Ti', 'V', 'Cr', 'Zr', 'W']
    r_max: ${cutoff_radius}

    radial_chemical_embed:
      _target_: allegro.nn.TwoBodyBesselScalarEmbed
      num_bessels: 8
      bessel_trainable: false
      polynomial_cutoff_p: 6

    # output dimension of the radial-chemical embedding
    radial_chemical_embed_dim: 128

    # scalar embedding MLP
    scalar_embed_mlp_hidden_layers_depth: 2
    scalar_embed_mlp_hidden_layers_width: 256
    scalar_embed_mlp_nonlinearity: silu

    l_max: 2
    parity: false
    num_layers: 2
    num_scalar_features: 128
    num_tensor_features: 64
    tp_path_channel_coupling: true
    allegro_mlp_hidden_layers_depth: 2
    allegro_mlp_hidden_layers_width: 512

    # average number of neighbors for edge sum normalization
    avg_num_neighbors: ${training_data_stats:num_neighbors_mean}

    # == per-type per-atom scales and shifts ==
    #per_type_energy_shifts: ${training_data_stats:per_atom_energy_mean}
    per_type_energy_shifts:
        Ti: -2.15203187
        V: -3.55411419
        Cr: -5.42767241
        Zr: -2.3361286
        W: -4.55186158
    per_type_energy_scales: ${training_data_stats:forces_rms}
    per_type_energy_scales_trainable: false
    per_type_energy_shifts_trainable: false

    # TODO: add another NLH pair potential option here 
    pair_potential:
      _target_: nequip.nn.pair_potential.ZBL
      units: metal
      chemical_species: ['Ti', 'V', 'Cr', 'Zr', 'W']

global_options:
  allow_tf32: false